[project]
name = "reports-reportlab-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mypy>=1.17.1",
    "myst-parser>=4.0.1",
    "pydantic>=2.11.7",
    "pytest>=8.4.2",
    "reportlab>=4.4.3",
    "ruff>=0.12.12",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "types-reportlab>=4.4.1.20250822",
]
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
pretty = true
show_error_codes = true
plugins = []
follow_imports = "normal"
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
    --strict-markers
    --disable-warnings
    --maxfail=3
    --cov=pdf_src
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-report=html
"""
testpaths = [
    "tests",
]

markers = [
    "slow: for slow tests",
    "integration: for integration tests",
]


[tool.coverage.run]
branch = true
parallel = true
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise NotImplementedError",
]

target-version = "py313"
line-length = 120
indent-width = 4

[lint]

select = [
    "E", # pycodestyle
    "F", # pyflakes
    "B", # flake8-bugbear
    "I", # isort
    "UP", # pyupgrade
    "N", # pep8-naming
    "S", # flake8-bandit
    "C4", # flake8-comprehensions
    "RUF", # dodatkowe checki Ruff
]
ignore = [
    "S311", # Standard pseudo-random generator is not suitable for cryptographic purposes
]

[lint.per-file-ignores]
"tests/*" = ["S101"]

[format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 100

# isort
[lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["app", "tests"]
order-by-type = true

# flake8-bugbear
[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

# pep8-naming
[lint.pep8-naming]
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

# pyupgrade
[lint.pyupgrade]
keep-runtime-typing = false
